# ==========================================================
#  RemoteADB 功能开关
#  修改本文件后 >>重启手机<< 生效
#  每个开关: 1 = 开启    0 = 关闭
# ==========================================================

# 【自绘九宫格锁屏】
#   1 = 启用: 模块接管锁屏, 物理亮屏即显示自绘图案锁;
#             adb 连上自动撤锁, 断开立即回锁
#   0 = 关闭: 完全不碰系统锁屏, 恢复系统原本的锁屏行为
#   图案密码见同目录 pattern.txt
LOCKSCREEN=1

# 【USB 网络共享】
#   1 = 启用: 开机自动开启 USB 网络共享(RNDIS),
#             插上电脑/路由器即可给对端提供网络
#   0 = 关闭: USB 只保留 adb 调试功能
USB_TETHER=0

# 【无线调试端口】
#   默认 5555。改端口后, 外网转发规则(frp/路由器/DDNS)要同步改
ADB_PORT=5555

# 【ADB 端口访问控制】(重要!)
#   部分 ROM(如 ColorOS)的 adbd 以 root 模式运行, 会跳过密钥鉴权,
#   此时"私钥"不构成防线, 任何人都能连。此开关用 iptables 做来源白名单。
#   1 = 启用白名单(推荐)   0 = 不限制(危险: 转发到公网=公网随便控)
ADB_FIREWALL=1

# 【允许访问 ADB 端口的来源网段】
#   空格分隔, 常用: 局域网 192.168.2.0/24 ; tailscale 100.64.0.0/10 ; 本机 127.0.0.1/32
ADB_ALLOWED_CIDRS=192.168.2.0/24 127.0.0.1/32

# 【adbd 保活检查间隔】(秒)
#   每隔这么久检查一次 5555 是否在监听, 掉线自动拉起
KEEPALIVE=60
